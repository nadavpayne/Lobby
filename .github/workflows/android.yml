# Builds the Android app (a debug APK you can install on any Android phone, no Google Play needed).
# Runs when the Android project or the app config changes, or by hand: GitHub → Actions → "Android app" → Run workflow.
# The APK is under the run's "Artifacts" (lobby-android.zip). The app loads the live site, so site deploys need no rebuild.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "capacitor.config.ts", "native/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The runner image may not ship the Android SDK; install it rather than rely on it.
      - uses: android-actions/setup-android@v3
      - run: npm ci --ignore-scripts
      - run: npx cap sync android
      # On failure, the last lines go into an annotation: run logs need a GitHub sign-in, annotations don't.
      - run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1 || {
            tail -n 60 build.log
            echo "::error title=Gradle failed::$(grep -E 'What went wrong|error:|Exception|> ' build.log | head -n 25 | tr '\n' ' ' | cut -c1-3000)"
            exit 1
          }
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: lobby-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
